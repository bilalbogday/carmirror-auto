name: Build CarMirror Auto APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Build Signed APK and AAB
        run: |
          gradle testDebugUnitTest assembleDebug assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk CarMirror-Auto.apk
          cp app/build/outputs/bundle/release/app-release.aab CarMirror-Auto.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarMirror-Auto-APK
          path: |
            CarMirror-Auto.apk
            CarMirror-Auto.aab

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "CarMirror Auto v1.2.0 (EGL/FBO/Overlay/Android 14+ Düzeltmeleri)"
          body: |
            ### 🚗 CarMirror Auto v1.2.0
            - **OpenGL/EGL Motoru Düzeltildi:** `EGL_WINDOW_BIT | EGL_PBUFFER_BIT` yapılandırması eklendi ve bağımsız FBO (düz yönlü 30 FPS) Wi-Fi tarayıcı akışı çalışır hale getirildi.
            - **Otomatik Yatay Mod & Ekran Karartma Düzeltildi:** `ScreenControlOverlay` görünürlük bayrağı (`alpha = 1.0f`, şeffaf zemin, `0.005f` arka ışık) Android 10–16 uyumlu hale getirildi.
            - **Android Auto Kararlılık Düzeltmesi:** `CarMirrorScreen.invalidate()` ana iş parçacığına (main thread) alındı ve `DisplayListener` ile gerçek zamanlı ekran dönüş algılama eklendi.
            - **Android 14/15/16 Tam Ekran Yakalama:** `MediaProjectionConfig.createConfigForDefaultDisplay()` ile tek uygulama seçici atlanıp doğrudan tam ekran yansıtma seçiliyor.
          files: |
            CarMirror-Auto.apk
            CarMirror-Auto.aab
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
