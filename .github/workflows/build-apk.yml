name: Build CarMirror Auto APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK and AAB
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk CarMirror-Auto.apk
          cp app/build/outputs/bundle/release/app-release.aab CarMirror-Auto.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarMirror-Auto-APK
          path: |
            CarMirror-Auto.apk
            CarMirror-Auto.aab

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "CarMirror Auto v1.1.0 (Güncellenmiş APK & Play Bundle)"
          body: |
            ### 🚗 CarMirror Auto v1.1.0
            - `CarAppService` (`onCreateSession(SessionInfo)`), `NavigationManager`, vektör ikon ve Android 11-16 paket görünürlüğü (`<queries>`) düzeltmeleri eklendi.
            - Geliştirici modu / DHU için `CarMirror-Auto.apk` ve resmi Google Play Dahili Test (Internal App Sharing) dağıtımı için `CarMirror-Auto.aab` eklendi.
          files: |
            CarMirror-Auto.apk
            CarMirror-Auto.aab
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
